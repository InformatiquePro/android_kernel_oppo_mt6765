name: Build MT6765 Kernel + AnyKernel3 Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🧰 Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex git \
          libncurses-dev libssl-dev lld llvm make python3 \
          unzip wget xz-utils zip cpio

    - name: 🔗 Ensure python link
      run: |
        if [ ! -e /usr/bin/python ]; then
          sudo ln -s /usr/bin/python3 /usr/bin/python
        fi

    - name: ⬇️ Download toolchains
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android11-release gcc-4.9
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android10-dev clang-repo
        mv clang-repo/clang-r353983c clang
        rm -rf clang-repo

    - name: ⚙️ Set PATH for toolchains
      run: |
        echo "PATH=$(pwd)/gcc-4.9/bin:$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV

    - name: 🛠️ Clean ALL missing Oppo Kconfigs automatically
      run: |
        mkdir -p out
        while ! make O=out ARCH=arm64 k65v1_64_bsp_defconfig 2> error.log; do
          MISSING_FILE=$(grep "can't open file" error.log | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$MISSING_FILE" ]; then
            echo "❌ Autre erreur bloquante :"
            cat error.log
            exit 1
          fi
          echo "🔨 Correction du fichier fantôme : $MISSING_FILE"
          find . -type f -name "*Kconfig*" -exec sed -i "s|source \"$MISSING_FILE\"|# source \"$MISSING_FILE\"|g" {} +
        done
        echo "✅ Kconfig généré avec succès !"

    - name: 🏗️ Build Kernel
      run: |
        make O=out ARCH=arm64 olddefconfig
        make -j$(nproc --all) \
          ARCH=arm64 \
          O=out \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-android- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          Image.gz dtbs

    - name: 📌 Verify build output
      run: |
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ Build successful"
        else
          echo "❌ Build failed"
          exit 1
        fi

    - name: 📦 Prepare AnyKernel3
      run: |
        mkdir -p artifact
        cp out/arch/arm64/boot/Image.gz-dtb artifact/zImage
        KVER=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' Makefile)
        echo "KVER=$KVER" >> $GITHUB_ENV
        git clone --depth=1 https://github.com/NyxNoirXD/AnyKernel3.git ak
        cp -r ak/* artifact/
        rm -rf artifact/.git

    - name: ⚙️ Configure AnyKernel3
      run: |
        sed -i 's|block=.*|block=/dev/block/by-name/boot|g' artifact/anykernel.sh
        sed -i 's|is_slot_device=.*|is_slot_device=0|g' artifact/anykernel.sh

    - name: 🧩 Create flashable zip
      run: |
        cd artifact
        zip -r ../lunacore-${{ env.KVER }}.zip *

    - name: 📤 Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: lunacore-${{ env.KVER }}
        path: lunacore-${{ env.KVER }}.zip
